            - {name: AGENTMESH_PUSH_SIGNING_SECRET, valueFrom: {secretKeyRef: {name: agentmesh-secrets, key: push-signing-secret}}}
            - {name: OPENAI_API_KEY, valueFrom: {secretKeyRef: {name: agentmesh-secrets, key: openai-api-key, optional: true}}}
            - {name: HF_TOKEN, valueFrom: {secretKeyRef: {name: agentmesh-secrets, key: hf-token, optional: true}}}
