apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: agentmesh
  labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: agentmesh}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: agentmesh, agentmesh/tier: edge}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: gateway
          image: agentmesh
          args: [run-gateway, --port, "9200"]
          ports: [{name: http, containerPort: 9200}]
          envFrom: [{configMapRef: {name: agentmesh-config}}]
          env:
            - {name: PORT, value: "9200"}
            - {name: AGENTMESH_GATEWAY_PUBLIC_URL, value: "https://agents.example.com"}
            - {name: AGENTMESH_API_KEYS, valueFrom: {secretKeyRef: {name: agentmesh-secrets, key: client-api-keys}}}
            - {name: AGENTMESH_OUTBOUND_API_KEY, valueFrom: {secretKeyRef: {name: agentmesh-secrets, key: service-key}}}
            - {name: AGENTMESH_GATEWAY_REDIS_URL, valueFrom: {secretKeyRef: {name: agentmesh-secrets, key: redis-url}}}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 15, failureThreshold: 3}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 384Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: agentmesh
spec:
  selector: {app.kubernetes.io/name: gateway}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: agentmesh
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gateway}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: agentmesh
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: gateway}
