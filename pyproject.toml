[project]
name = "agentmesh"
version = "0.1.0"
description = "A2A-compliant multi-agent orchestration platform: agent runtime, registry, gateway, orchestrator and client tooling."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Rajarajacholan Krishnamurthy", email = "krisrajz@live.com" }]
requires-python = ">=3.12"
keywords = ["a2a", "agent2agent", "multi-agent", "orchestration", "llm", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "a2a-sdk[http-server,sqlite,postgresql,telemetry]>=1.2.1",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
mcp = ["mcp>=1.9,<2"]
adk = [
    "google-adk[a2a]>=2.11",
    "litellm>=1.103.2",
]
maf = [
    "agent-framework-a2a>=1.0.0b261002",
    "agent-framework-core>=1.20.0",
    "agent-framework-openai>=1.15.0",
]

[project.scripts]
agentmesh = "agentmesh.cli.main:app"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy<1.20",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
    "types-requests>=2.33.0.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF", "C4", "PT", "TID"]
ignore = ["S101", "RUF012", "SIM905", "ASYNC109", "E501"]  # E501: the formatter owns line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S104", "S110", "PT018", "PT012", "SIM117", "E501", "RUF043", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/agentmesh"]

[[tool.mypy.overrides]]
module = ["a2a.*", "google.*", "prometheus_client.*", "redis.*", "mcp.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# a2a-sdk ships without type information for some base classes we extend.
module = ["agentmesh.runtime.executor", "agentmesh.runtime.push"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: exercises real LLM providers; requires API keys (deselected by default)",
    "real_ssrf: runs the real SSRF validator instead of the in-process stub",
]
filterwarnings = ["ignore::DeprecationWarning:google.*"]

[tool.coverage.run]
source = ["src/agentmesh"]
branch = true
